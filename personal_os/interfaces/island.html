<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Donna</title>
<style>
/* The island: black, like the Mac's. The window is the island's shape (a region set by
   interfaces/island.py), so everything here is drawn on black and clipped by it. */
:root { --ink:#f2f2f4; --muted:#8e8e96; --faint:#5c5c63; --line:#232327; --chip:#1b1b1f;
  --accent:#8aa4ff; --ok:#4cd483; --warn:#ffb340; --bad:#ff6b5e;
  --spring:cubic-bezier(.32,.72,0,1); --W:560px; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
  font:13.5px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; user-select:none;
  -webkit-font-smoothing:antialiased; }
.hidden { display:none !important; }
button { font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line);
  border-radius:999px; padding:3px 11px; font-size:12px; cursor:pointer;
  transition:background .15s, border-color .15s, transform .12s var(--spring); }
button:hover { border-color:#3a3a42; background:#24242a; }
button:active { transform:scale(.96); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
button[aria-pressed="true"] { background:var(--accent); color:#0c0f1a; border-color:var(--accent); }

/* --- the pill --- */
#pill { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  gap:10px; padding:0 14px; opacity:1; transition:opacity .16s ease .05s; cursor:default; }
body.open #pill { opacity:0; transition:opacity .08s ease; pointer-events:none; }
body.gone #pill { opacity:0; transition:opacity .08s ease; }  /* sliding up out of sight */
#pill .time { font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.2px; }
#pill .sep { flex:1; }
.state { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none;
  transition:background .3s; }
.state.on { background:var(--ok); box-shadow:0 0 8px rgba(76,212,131,.6); }
.state.listen { background:var(--ok); animation:breathe 1.1s ease-in-out infinite; }
.state.think { background:var(--accent); animation:breathe .8s ease-in-out infinite; }
.state.speak { background:var(--accent); }
.state.alert { background:var(--warn); animation:breathe 1.4s ease-in-out infinite; }
.state.rest { background:#6b7280; box-shadow:none; }  /* resting: not listening */
@keyframes breathe { 50% { transform:scale(1.5); opacity:.6; } }
.bars { display:flex; gap:2px; align-items:center; height:14px; }
.bars i { width:3px; height:14px; border-radius:2px; background:var(--ok);
  transform:scaleY(.3); animation:bar .9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay:.18s } .bars i:nth-child(3) { animation-delay:.36s }
.bars i:nth-child(4) { animation-delay:.54s }
.bars.paused i { animation:none; }
@keyframes bar { 0%,100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }
#pill .what { color:var(--muted); font-size:12px; max-width:150px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }

/* --- open: a fixed-width layer, centred, so nothing reflows while the shape grows --- */
#open { position:absolute; top:0; left:50%; width:var(--W); margin-left:calc(var(--W) / -2);
  height:100%; opacity:0; transform:scale(.97) translateY(-6px); transform-origin:50% 0;
  transition:opacity .1s ease, transform .1s ease; pointer-events:none; display:flex;
  flex-direction:column; }
body.open #open { opacity:1; transform:none; pointer-events:auto;
  transition:opacity .22s ease .1s, transform .42s var(--spring) .04s; }
#top { display:flex; align-items:center; gap:6px; padding:10px 16px 4px; flex:none; }
#tabs { display:flex; gap:2px; flex:1; justify-content:center; }
#tabs button { background:transparent; border:none; color:var(--muted); padding:3px 10px; }
#tabs button.on { color:var(--ink); background:var(--chip); }
.arrow { width:26px; height:26px; padding:0; display:grid; place-items:center; opacity:0;
  transition:opacity .2s; font-size:15px; }
body.open:hover .arrow { opacity:1; }
#viewport { flex:1; overflow:hidden; position:relative; }
#track { display:flex; height:100%; width:calc(var(--W) * 5);
  transition:transform .48s var(--spring); will-change:transform; }
.page { width:var(--W); height:100%; padding:2px 18px 12px; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:#2c2c31 transparent; }
#dots { display:flex; gap:5px; justify-content:center; padding:0 0 8px; flex:none; }
#dots i { width:5px; height:5px; border-radius:50%; background:#3a3a40;
  transition:background .25s, width .35s var(--spring); cursor:pointer; }
#dots i.on { background:var(--ink); width:14px; border-radius:3px; }
.h { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--faint);
  margin:10px 0 4px; }
.row { display:flex; gap:8px; align-items:baseline; padding:3px 0; }
.row .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .side { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.row.overdue .side { color:var(--bad); }
.big { font-size:26px; font-weight:600; letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.chip { background:var(--chip); border-radius:999px; padding:2px 10px; font-size:12px;
  color:var(--muted); }
.chip b { color:var(--ink); font-weight:600; }
.empty { color:var(--faint); padding:6px 0; }
.foot { display:flex; justify-content:flex-end; margin-top:8px; }
.link { background:none; border:none; color:var(--accent); padding:2px 0; }
.link:hover { background:none; text-decoration:underline; }
.proj { padding:7px 0; border-bottom:1px solid var(--line); }
.proj:last-child { border-bottom:none; }
.proj .name { font-weight:600; } .proj .when { color:var(--muted); font-size:12px; float:right; }
.proj .left { color:var(--muted); font-size:12.5px; margin-top:1px; }
.proj .next { font-size:12.5px; margin-top:2px; } .proj .next::before { content:"☐ "; color:var(--faint); }

/* To-dos you can tick, and the boxes to add a to-do or a note */
.check { width:20px; height:20px; padding:0; border-radius:6px; flex:none; display:grid;
  place-items:center; font-size:12px; line-height:1; background:transparent;
  border:1.5px solid #4a4a52; color:transparent; align-self:center; }
.check:hover { border-color:var(--ok); background:transparent; }
.row.done .check { background:var(--ok); border-color:var(--ok); color:#06150c; }
.row.done .grow { color:var(--faint); text-decoration:line-through; }
.row.todo { align-items:center; }
.addform { display:flex; gap:6px; margin-top:8px; }
.addform input, .addform select { background:#111114; color:var(--ink); border:1px solid var(--line);
  border-radius:999px; font:inherit; font-size:12.5px; padding:5px 12px; user-select:text; }
.addform input { flex:1; min-width:0; }
.addform select { max-width:150px; padding-right:6px; }
.addform input:focus, .addform select:focus { outline:none; border-color:var(--accent); }
.addform input::placeholder { color:var(--faint); }
.formnote { color:var(--warn); font-size:12px; min-height:0; }
.note { padding:6px 0; border-bottom:1px solid var(--line); }
.note:last-child { border-bottom:none; }
.note .text { white-space:pre-wrap; word-wrap:break-word; user-select:text; font-size:13px; }
.note .meta { color:var(--faint); font-size:11.5px; margin-top:1px; }

/* Music */
.player { display:flex; gap:14px; align-items:center; padding-top:10px; }
.art { width:64px; height:64px; border-radius:14px; flex:none;
  background:linear-gradient(135deg,#3b2f7a,#b8457e 60%,#f0a35a); display:grid; place-items:center; }
.player .t { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player .a { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.controls { display:flex; gap:10px; justify-content:center; margin-top:14px; }
.controls button { width:40px; height:40px; padding:0; font-size:15px; }
.controls .main { width:48px; height:48px; background:var(--ink); color:#000; border-color:var(--ink); }

/* Donna (the voice popup's content) */
#vhead { display:flex; align-items:center; gap:10px; padding:4px 0 2px; }
#vlabel { font-weight:600; flex:1; } #trigger { color:var(--faint); font-size:12px; }
.line { margin:4px 0; white-space:pre-wrap; word-wrap:break-word; user-select:text; }
.who { color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
#heard { color:var(--muted); font-style:italic; }
#question { color:var(--warn); } #progress { color:var(--muted); font-size:12px; }
#error { color:var(--bad); } #notice { color:var(--warn); font-size:12px; }
#earlier .ex { margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid var(--line);
  color:var(--muted); font-size:12.5px; }
#earlier .ex .q { font-style:italic; } #earlier .ex .a { white-space:pre-wrap; }
#details { margin:8px 0; padding:8px 10px; border-radius:12px; background:#111114; font-size:12.5px;
  user-select:text; }
#details .row2 { margin:2px 0; white-space:pre-wrap; word-wrap:break-word; }
#details .row2.item::before { content:"• "; color:var(--faint); }
#details a { color:var(--accent); cursor:pointer; text-decoration:underline; }
.alert { border:1px solid rgba(255,179,64,.5); border-radius:14px; padding:7px 10px; margin:6px 0;
  display:flex; gap:8px; align-items:flex-start; }
.alert .body { flex:1; } .alert b { color:var(--warn); } .alert .when { color:var(--muted); font-size:12px; }
#askform { display:flex; gap:6px; margin-top:8px; }
#prompt { flex:1; min-width:0; background:#111114; color:var(--ink); border:1px solid var(--line);
  border-radius:999px; font:inherit; padding:6px 12px; user-select:text; }
#prompt:focus { outline:none; border-color:var(--accent); }
#prompt::placeholder { color:var(--faint); }
#vfoot { display:flex; gap:6px; align-items:center; margin-top:8px; }
#note { color:var(--faint); font-size:12px; flex:1; min-width:0; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
#stop { border-color:rgba(255,107,94,.6); }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="pill" aria-label="Donna">
  <span id="pstate" class="state"></span>
  <span class="time" id="clock">--:--</span>
  <span id="pwhat" class="what hidden"></span>
  <span class="sep hidden"></span>
  <span id="pbars" class="bars hidden"><i></i><i></i><i></i><i></i></span>
</div>

<div id="open">
  <div id="top">
    <button class="arrow" id="prev" title="Previous (←)" aria-label="Previous page">‹</button>
    <div id="tabs" role="tablist"></div>
    <button class="arrow" id="next" title="Next (→)" aria-label="Next page">›</button>
  </div>
  <div id="viewport">
    <div id="track">
      <section class="page" id="p-donna" aria-label="Donna"><div id="donna">
        <div id="vhead"><span id="vstate" class="state"></span><span id="vlabel" role="status" aria-live="polite">Ready</span><span id="trigger"></span></div>
        <div id="earlier" class="hidden"></div>
        <div id="alerts"></div>
        <div id="notice" class="line hidden"></div>
        <div id="heardbox" class="hidden"><span class="who">You</span><div id="heard" class="line"></div></div>
        <div id="progress" class="line hidden"></div>
        <div id="question" class="line hidden"></div>
        <div id="replybox" class="hidden"><span class="who">Donna</span><div id="reply" class="line"></div></div>
        <div id="details" class="hidden"></div>
        <div id="error" class="line hidden"></div>
        <form id="askform" autocomplete="off">
          <input id="prompt" type="text" maxlength="2000" placeholder="Ask Donna…" aria-label="Type a question for Donna">
          <button id="talk" type="button" title="Start listening, like the hotkey">Talk</button>
        </form>
        <div id="vfoot">
          <span id="note">Swipe for Today, Notes, Music, Projects</span>
          <button id="stop" class="hidden" title="Stop (Esc)">Stop</button>
          <button id="pin" aria-pressed="false" title="Keep open">Pin</button>
          <button id="full" title="Open the full dashboard">Open full ↗</button>
        </div>
      </div></section>
      <section class="page" id="p-today" aria-label="Today">
        <div id="today-body"></div>
        <form id="todo-form" class="addform" autocomplete="off">
          <input id="todo-text" type="text" maxlength="300" placeholder="Add a to-do… (call mum tomorrow 5pm)" aria-label="Add a to-do">
        </form>
        <div id="todo-why" class="formnote"></div>
        <div id="today-foot"></div>
      </section>
      <section class="page" id="p-notes" aria-label="Notes">
        <form id="note-form" class="addform" autocomplete="off">
          <input id="note-text" type="text" maxlength="5000" placeholder="Jot a note…" aria-label="Write a note">
          <select id="note-project" aria-label="Which project the note goes to"><option value="">Inbox</option></select>
        </form>
        <div id="note-why" class="formnote"></div>
        <div id="notes-body"></div>
      </section>
      <section class="page" id="p-music" aria-label="Music"></section>
      <section class="page" id="p-projects" aria-label="Projects"></section>
    </div>
  </div>
  <div id="dots"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PAGES = ["donna", "today", "notes", "music", "projects"];
const TITLES = { donna: "Donna", today: "Today", notes: "Notes", music: "Music", projects: "Projects" };
const ACTIVE = ["listening", "thinking", "speaking"];
const LABELS = { listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…",
  done: "Done", idle: "Ready", "not running": "Voice isn't running" };
const api = () => window.pywebview && window.pywebview.api;
let S = { mode: "pill", page: "today", view: {}, music: false };
let page = "today";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // text only: nothing shown is parsed as HTML
  return e;
}
function show(id, text) { const e = $(id); e.textContent = text || ""; e.classList.toggle("hidden", !text); }
function box(id, text) { $(id).textContent = text || ""; $(id + "box").classList.toggle("hidden", !text); }

// --- the pill ---------------------------------------------------------------------------
function tickClock() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
tickClock(); setInterval(tickClock, 5000);

function stateClass(v) {
  const alerts = (v.alerts || []).length;
  if (alerts && !ACTIVE.includes(v.state)) return "alert";
  return { listening: "listen", thinking: "think", speaking: "speak" }[v.state]
    || (v.voice_running ? "on" : "");
}

function renderPill() {
  const v = S.view || {};
  const resting = S.rest > 0 && !ACTIVE.includes(v.state);
  $("pstate").className = "state " + (resting ? "rest" : stateClass(v));
  const alerts = v.alerts || [];
  const what = alerts.length ? alerts[alerts.length - 1].text
    : resting ? `Resting · ${S.rest} min` : (S.music ? "Playing" : "");
  show("pwhat", what);
  $("pbars").classList.toggle("hidden", !S.music || alerts.length > 0);
  document.querySelector("#pill .sep").classList.toggle("hidden", !what && !S.music);
}

// --- pages ------------------------------------------------------------------------------
PAGES.forEach((p) => {
  const b = el("button", "", TITLES[p]);
  b.setAttribute("role", "tab");
  b.onclick = () => go(p);
  b.id = "tab-" + p;
  $("tabs").append(b);
  const d = el("i");
  d.onclick = () => go(p);
  d.id = "dot-" + p;
  $("dots").append(d);
});

function slide(p) {
  page = p;
  const i = PAGES.indexOf(p);
  $("track").style.transform = `translateX(${-i * 560}px)`;
  PAGES.forEach((q) => {
    $("tab-" + q).classList.toggle("on", q === p);
    $("dot-" + q).classList.toggle("on", q === p);
  });
  if (p !== "donna") load(p);
  measure();
}

function go(p) {  // your choice: slide now, then tell Python (it sizes the island for it)
  if (!PAGES.includes(p) || p === page) return;
  slide(p);
  api() && api().page(p);
}
function step(d) { go(PAGES[(PAGES.indexOf(page) + d + PAGES.length) % PAGES.length]); }
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

// Two-finger swipe on the touchpad (a sideways wheel): one page per gesture.
let acc = 0, lockUntil = 0, accTimer = null;
window.addEventListener("wheel", (e) => {
  if (!document.body.classList.contains("open")) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;  // up/down scrolls the page
  e.preventDefault();
  const now = performance.now();
  if (now < lockUntil) return;
  acc += e.deltaX;
  clearTimeout(accTimer);
  accTimer = setTimeout(() => { acc = 0; }, 180);
  if (Math.abs(acc) > 45) {
    step(acc > 0 ? 1 : -1);
    acc = 0;
    lockUntil = now + 450;  // a swipe's momentum doesn't skip a second page
  }
}, { passive: false });

// --- cards ------------------------------------------------------------------------------
const loaded = {};
const FRESH = { today: 20000, notes: 20000, projects: 30000, music: 3000 };
async function load(p, force) {
  if (!api() || S.mode !== "open") return;
  if (!force && loaded[p] && performance.now() - loaded[p] < FRESH[p]) return;
  loaded[p] = performance.now();
  try { render[p](await api().cards(p)); } catch (e) { /* next time */ }
}
setInterval(() => { if (S.mode === "open" && page !== "donna") load(page); }, 1000);

function fullButton(p) {
  const f = el("div", "foot");
  const b = el("button", "link", "Open full ↗");
  b.onclick = () => api().open_full(p);
  f.append(b);
  return f;
}

// A to-do's box: tick it off (struck through, kept until the next refresh so a mis-click is
// undone by clicking again), or back on.
function todoRow(t) {
  const r = el("div", "row todo" + (t.overdue ? " overdue" : ""));
  const b = el("button", "check", "✓");
  b.type = "button";
  b.title = "Done";
  b.setAttribute("aria-label", "Mark done: " + t.text);
  b.onclick = async () => {
    const done = !r.classList.contains("done");
    r.classList.toggle("done", done);
    b.title = done ? "Not done after all" : "Done";
    loaded.today = performance.now();  // don't refresh it away straight after the tick
    const ok = await api().todo(t.id, done);
    if (!ok) r.classList.toggle("done", !done);
  };
  r.append(b, el("span", "grow", t.text + (t.project ? " · " + t.project : "")),
    el("span", "side", t.overdue ? "overdue" : t.due || ""));
  return r;
}

const render = {
  today(d) {
    const pg = $("today-body");
    pg.replaceChildren();
    $("today-foot").replaceChildren(fullButton("today"));
    if (d.error) { pg.append(el("div", "empty", d.error)); return; }
    pg.append(el("div", "h", "Worked today"));
    pg.append(el("div", "big", d.worked || "—"));
    const chips = el("div", "chips");
    for (const p of d.projects || []) {
      const c = el("span", "chip"); c.append(el("b", "", p.name), document.createTextNode(" " + p.time));
      chips.append(c);
    }
    pg.append(chips);
    pg.append(el("div", "h", "Coming up"));
    const rem = d.reminders || [], todos = d.todos || [];
    if (!rem.length && !todos.length) pg.append(el("div", "empty", "Nothing due. Add a to-do below."));
    for (const r of rem) {
      const row = el("div", "row");
      row.append(el("span", "", "⏰"), el("span", "grow", r.text), el("span", "side", r.when));
      pg.append(row);
    }
    for (const t of todos) pg.append(todoRow(t));
    if (d.more_todos) pg.append(el("div", "empty", `+${d.more_todos} more on the dashboard`));
  },
  notes(d) {
    const pg = $("notes-body");
    pg.replaceChildren();
    if (d.error) { pg.append(el("div", "empty", d.error)); return; }
    const pick = $("note-project"), chosen = pick.value;
    pick.replaceChildren(el("option", "", "Inbox"));
    pick.firstChild.value = "";
    for (const p of d.projects || []) {
      const o = el("option", "", p.name);
      o.value = p.id;
      pick.append(o);
    }
    pick.value = [...pick.options].some((o) => o.value === chosen) ? chosen : "";
    const list = d.notes || [];
    if (!list.length) pg.append(el("div", "empty", "No notes yet. Jot one above."));
    for (const n of list) {
      const c = el("div", "note");
      c.append(el("div", "text", n.text), el("div", "meta", (n.project || "Inbox") + " · " + n.when));
      pg.append(c);
    }
    pg.append(fullButton("projects"));
  },
  projects(d) {
    const pg = $("p-projects");
    pg.replaceChildren();
    if (d.error) { pg.append(el("div", "empty", d.error)); return; }
    const list = d.projects || [];
    if (!list.length) pg.append(el("div", "empty", "No projects worked on yet."));
    for (const p of list) {
      const c = el("div", "proj");
      c.append(el("span", "when", p.when), el("div", "name", p.name));
      if (p.left_off) c.append(el("div", "left", p.left_off));
      if (p.next_todo) c.append(el("div", "next", p.next_todo + (p.todos > 1 ? `  (+${p.todos - 1})` : "")));
      pg.append(c);
    }
    pg.append(fullButton("projects"));
  },
  // Your music source only (config [music]): its name, the song, and its controls; when it
  // isn't open, a button to open it (in its app if it's installed).
  music(d) {
    const pg = $("p-music");
    pg.replaceChildren();
    const src = d.source || "Music";
    pg.append(el("div", "h", src + (d.where ? " · " + (d.where === "app" ? "app" : "browser") : "")));
    if (!d.available) { pg.append(el("div", "empty", d.why || "Nothing to show.")); return; }
    const said = el("div", "formnote");
    const act = async (action) => {
      const r = await api().media(action);
      said.textContent = r && !r.ok ? r.text : "";
      setTimeout(() => load("music", true), action === "open" ? 2500 : 450);
    };
    if (d.open === false) {
      pg.append(el("div", "empty", d.why || src + " isn't open."));
      const c = el("div", "controls");
      const b = el("button", "main", "▶");
      b.title = "Play: opens " + src;
      b.onclick = () => act("play");
      const o = el("button", "", "Open " + src);
      o.style.width = "auto"; o.style.padding = "0 14px";
      o.onclick = () => act("open");
      c.append(b, o);
      pg.append(c, said);
      return;
    }
    const pl = el("div", "player");
    const art = el("div", "art");
    const bars = el("span", "bars" + (d.playing ? "" : " paused"));
    for (let i = 0; i < 4; i++) bars.append(el("i"));
    art.append(bars);
    const meta = el("div", "grow");
    meta.style.minWidth = "0";
    meta.append(el("div", "t", d.title || "Nothing chosen yet"),
      el("div", "a", d.artist || (d.title ? "" : "Ask Donna to play something")));
    pl.append(art, meta);
    pg.append(pl);
    const c = el("div", "controls");
    const mk = (label, title, action, main) => {
      const b = el("button", main ? "main" : "", label);
      b.title = title;
      b.onclick = () => act(action);
      return b;
    };
    c.append(mk("⏮", "Previous", "previous"), mk(d.playing ? "⏸" : "▶", d.playing ? "Pause" : "Play",
      d.playing ? "pause" : "play", true), mk("⏭", "Next", "next"));
    pg.append(c, said);
  },
};

// --- Donna (as the voice popup) -----------------------------------------------------------
const URL_RE = /(https?:\/\/[^\s<>"')\]]+)/g;
let lastAlerts = "", lastDetails = null;
function renderAlerts(alerts) {
  const key = alerts.map((a) => a.id).join(",");
  if (key === lastAlerts) return;
  lastAlerts = key;
  $("alerts").replaceChildren();
  for (const a of alerts) {
    const card = el("div", "alert");
    const body = el("div", "body");
    const t = new Date(a.at);
    body.append(el("b", "", a.title), el("span", "when", isNaN(t) ? "" : "  " + t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })), el("div", "line", a.text));
    const btn = el("button", "", "Dismiss");
    btn.onclick = () => api().dismiss(a.id);
    card.append(body, btn);
    $("alerts").append(card);
  }
}
function renderDetails(text) {
  if (text === lastDetails) return;
  lastDetails = text;
  const b = $("details");
  b.replaceChildren();
  b.classList.toggle("hidden", !text);
  for (const raw of (text || "").split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const item = /^([-*•]|\d+[.)]|\[\d+\])\s+/.test(line);
    const row = el("div", "row2" + (item ? " item" : ""));
    const body = item ? line.replace(/^([-*•]|\d+[.)])\s+/, "") : line;
    let at = 0;
    for (const m of body.matchAll(URL_RE)) {
      row.append(document.createTextNode(body.slice(at, m.index)));
      const a = el("a", "", m[0].length > 60 ? m[0].slice(0, 57) + "…" : m[0]);
      a.title = m[0];
      a.onclick = () => api().open_link(m[0]);
      row.append(a);
      at = m.index + m[0].length;
    }
    row.append(document.createTextNode(body.slice(at)));
    b.append(row);
  }
}
const earlier = [];
let current = { id: "", heard: "", reply: "" };
function track(v) {
  if (v.turn_id && v.turn_id !== current.id) {
    if (current.id && (current.heard || current.reply)) {
      earlier.push({ heard: current.heard, reply: current.reply });
      if (earlier.length > 4) earlier.shift();
      const b = $("earlier");
      b.replaceChildren();
      for (const ex of earlier) {
        const it = el("div", "ex");
        if (ex.heard) it.append(el("div", "q", "You: " + ex.heard));
        if (ex.reply) it.append(el("div", "a", ex.reply));
        b.append(it);
      }
      b.classList.toggle("hidden", !earlier.length);
    }
    current = { id: v.turn_id, heard: "", reply: "" };
  }
  if (v.heard) current.heard = v.heard;
  if (v.reply) current.reply = v.reply;
}
function renderDonna(v) {
  track(v);
  const alerts = v.alerts || [];
  const alertOnly = alerts.length > 0 && !ACTIVE.includes(v.state);
  renderAlerts(alerts);
  $("vstate").className = "state " + stateClass(v);
  const followup = v.trigger === "followup";
  const resting = S.rest > 0 && !ACTIVE.includes(v.state);
  $("vlabel").textContent = alertOnly ? alerts[alerts.length - 1].title
    : followup && v.state === "listening" && !v.question ? "Anything else?"
    : resting ? `Resting · ${S.rest} min left` : (LABELS[v.state] || "Ready");
  if (resting && !alertOnly) $("vstate").className = "state rest";
  $("talk").textContent = resting ? "Wake & talk" : "Talk";
  $("trigger").textContent = v.trigger && !followup && !alertOnly ? "via " + v.trigger : "";
  if (alertOnly) v = Object.assign({}, v, { heard: "", reply: "", question: "", error: "" });
  const notices = [];
  if (v.killed) notices.push("Actions are off (kill switch).");
  if (v.paused) notices.push("Capture is paused.");
  show("notice", notices.join(" "));
  box("heard", v.heard);
  show("question", v.question);
  show("progress", v.state === "thinking" && !alertOnly ? v.progress : "");
  $("stop").classList.toggle("hidden", !ACTIVE.includes(v.state));
  box("reply", v.reply);
  show("error", v.error);
  renderDetails(alertOnly ? "" : v.details);
  $("pin").setAttribute("aria-pressed", v.pinned ? "true" : "false");
}

// The Donna page is as tall as what's on it: Python sizes the island to fit.
let lastH = 0;
function measure() {
  if (!api()) return;
  const h = page === "donna" ? Math.ceil($("donna").scrollHeight + $("top").offsetHeight + $("dots").offsetHeight + 22) : 0;
  if (h && Math.abs(h - lastH) > 2) { lastH = h; api().measured(h); }
}
new ResizeObserver(measure).observe($("donna"));

// --- updates from Python ---------------------------------------------------------------
window.island = {
  update(s) {
    const was = S.mode;
    S = s;
    document.body.classList.toggle("open", s.mode === "open");
    document.body.classList.toggle("gone", s.mode === "hidden");
    renderPill();
    renderDonna(s.view || {});
    if (s.page !== page) slide(s.page);
    else if (s.mode === "open" && was !== "open" && page !== "donna") load(page, true);
    if (s.mode !== "open" && document.activeElement) document.activeElement.blur();
    measure();
  },
};

// --- you ----------------------------------------------------------------------------------
let hovering = false;
const BOXES = ["prompt", "todo-text", "note-text"];
const inBox = () => document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName);
function hold() {  // typing in any box keeps the island open, like the Donna prompt
  const typing = inBox() || BOXES.some((id) => $(id).value.trim() !== "");
  api() && api().hold(hovering || typing);
  api() && api().typing(typing);
}
document.documentElement.addEventListener("mouseenter", () => { hovering = true; api() && api().hover(true); hold(); });
document.documentElement.addEventListener("mouseleave", () => { hovering = false; api() && api().hover(false); hold(); });
for (const id of [...BOXES, "note-project"]) {
  $(id).addEventListener("focus", hold);
  $(id).addEventListener("blur", hold);
  $(id).addEventListener("input", hold);
}
async function addFrom(kind, input, why, page, project) {
  const text = input.value.trim();
  if (!text) return;
  const err = await api().add(kind, text, project || "");
  why.textContent = err || "";
  if (err) return;
  input.value = "";
  hold();
  load(page, true);
}
$("todo-form").addEventListener("submit", (e) => {
  e.preventDefault();
  addFrom("todo", $("todo-text"), $("todo-why"), "today");
});
$("note-form").addEventListener("submit", (e) => {
  e.preventDefault();
  addFrom("note", $("note-text"), $("note-why"), "notes", $("note-project").value);
});
document.addEventListener("pointerdown", () => { if (S.mode === "open" && api()) api().focus(); });
// Using it (a click, a key, typing, a scroll or swipe) is told to Python, which closes the
// island 5 s after you're done with it unless the pointer is still on it. At most 3 a second.
let usedAt = 0;
function used() {
  const now = performance.now();
  if (S.mode !== "open" || !api() || now - usedAt < 300) return;
  usedAt = now;
  api().used();
}
for (const ev of ["pointerdown", "keydown", "input", "wheel"]) {
  document.addEventListener(ev, used, { passive: true, capture: true });
}
$("askform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("prompt").value.trim();
  if (!text) return;
  const why = await api().ask(text);
  if (why) { $("note").textContent = why; return; }
  $("prompt").value = "";
  $("note").textContent = "Sent to Donna.";
  hold();
});
$("talk").onclick = async () => { $("note").textContent = (await api().talk()) || "Listening…"; };
$("stop").onclick = () => api().stop(false);
$("pin").onclick = async () => {
  const on = $("pin").getAttribute("aria-pressed") !== "true";
  $("pin").setAttribute("aria-pressed", (await api().pin(on)) ? "true" : "false");
};
$("full").onclick = async () => { $("note").textContent = (await api().open_full("donna")) || "Opened the dashboard."; };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && a.value) { a.value = ""; hold(); return; }
    const busy = ACTIVE.includes((S.view || {}).state);
    busy ? api().stop(true) : api().close();
    return;
  }
  if (inBox()) return;  // arrow keys move the caret in a box, not the page
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
window.addEventListener("pywebviewready", () => { slide(page); measure(); });
</script>
