<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Personal OS voice</title>
<style>
/* The dashboard's dark palette (web/html.py). */
:root { --bg:#141416; --card:#1d1d20; --ink:#ececee; --muted:#9a9aa2; --line:#2c2c31;
  --accent:#7f9cff; --ok:#4cc483; --warn:#f0a63a; --bad:#ff6b5e; --chip:#262a38; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--card); color:var(--ink);
  font:14px/1.4 "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
main, input { user-select:text; }  /* answers can be selected and copied */
body { display:flex; flex-direction:column; border:1px solid var(--line); }
header { display:flex; align-items:center; gap:10px; padding:10px 12px 6px; }
#label { font-weight:600; flex:1; }
#trigger { color:var(--muted); font-size:12px; }
button { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:6px;
  font:inherit; font-size:12px; padding:2px 8px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button[aria-pressed="true"] { background:var(--accent); color:#10131c; }
main { flex:1; padding:0 12px; overflow-y:auto; scrollbar-width:thin;
  scrollbar-color:var(--line) transparent; }
.line { margin:4px 0; white-space:pre-wrap; word-wrap:break-word; }
.who { color:var(--muted); font-size:12px; }
#heard { color:var(--muted); font-style:italic; }
#question { color:var(--warn); }
#progress { color:var(--muted); font-size:12px; }
#stop { border-color:var(--bad); }
#error { color:var(--bad); }
#notice { color:var(--warn); font-size:12px; }
footer { display:flex; gap:6px; padding:4px 12px 10px; align-items:center; }
#note { color:var(--muted); font-size:12px; flex:1; min-width:0; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.hidden { display:none; }
/* Earlier exchanges in this window: the conversation so far, quieter than the current one. */
#earlier .ex { margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid var(--line);
  color:var(--muted); font-size:13px; }
#earlier .ex .q { font-style:italic; }
#earlier .ex .a { white-space:pre-wrap; word-wrap:break-word; }
/* Standby: the next prompt, typed or spoken. */
#askform { display:flex; gap:6px; padding:6px 12px 0; }
#prompt { flex:1; min-width:0; background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:6px; font:inherit; font-size:13px; padding:5px 8px; }
#prompt:focus { outline:none; border-color:var(--accent); }
#prompt::placeholder { color:var(--muted); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
#details { margin:8px 0; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); font-size:13px; }
#details .row { margin:2px 0; white-space:pre-wrap; word-wrap:break-word; }
#details .row.item::before { content:"• "; color:var(--muted); }
#details a { color:var(--accent); cursor:pointer; text-decoration:underline; }
.alert { border:1px solid var(--warn); border-radius:8px; padding:6px 8px; margin:6px 0;
  display:flex; gap:8px; align-items:flex-start; }
.alert .body { flex:1; } .alert b { color:var(--warn); } .alert .when { color:var(--muted); font-size:12px; }
.bell { width:10px; height:10px; margin:6px; border-radius:50%; background:var(--warn);
  animation:pulse 1.6s ease-out infinite; }

/* State indicator */
#ind { width:22px; height:22px; position:relative; flex:none; }
.mic { width:12px; height:12px; border-radius:50%; background:var(--ok); position:absolute;
  left:5px; top:5px; }
.mic::after { content:""; position:absolute; inset:-5px; border-radius:50%;
  border:2px solid var(--ok); animation:pulse 1.2s ease-out infinite; }
@keyframes pulse { from { transform:scale(.6); opacity:1; } to { transform:scale(1.4); opacity:0; } }
.spin { width:18px; height:18px; margin:2px; border-radius:50%; border:3px solid var(--line);
  border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.bars { display:flex; gap:2px; align-items:center; height:22px; }
.bars i { width:3px; height:18px; background:var(--accent); border-radius:2px;
  transform:scaleY(.25); animation:bar .9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay:.15s } .bars i:nth-child(3) { animation-delay:.3s }
.bars i:nth-child(4) { animation-delay:.45s }
@keyframes bar { 0%,100% { transform:scaleY(.25); } 50% { transform:scaleY(1); } }
.dot { width:10px; height:10px; margin:6px; border-radius:50%; background:var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<header>
  <div id="ind" aria-hidden="true"></div>
  <div id="label" role="status" aria-live="polite">Starting…</div>
  <span id="trigger"></span>
</header>
<main id="main">
  <div id="earlier" class="hidden" aria-label="Earlier in this conversation"></div>
  <div id="alerts"></div>
  <div id="notice" class="line hidden"></div>
  <div id="heardbox" class="hidden"><span class="who">You</span><div id="heard" class="line"></div></div>
  <div id="progress" class="line hidden"></div>
  <div id="question" class="line hidden"></div>
  <div id="replybox" class="hidden"><span class="who">Reply</span><div id="reply" class="line"></div></div>
  <div id="details" class="hidden"></div>
  <div id="error" class="line hidden"></div>
</main>
<form id="askform" autocomplete="off">
  <input id="prompt" type="text" maxlength="2000" placeholder="Ask Donna… (Enter)"
    aria-label="Type your next question for Donna">
  <button id="talk" type="button" title="Start listening, like the push-to-talk key">Talk</button>
</form>
<footer>
  <span id="note">Esc closes</span>
  <button id="stop" class="hidden" title="Stop listening, thinking or talking (Esc)">Stop</button>
  <button id="expand" aria-pressed="false" title="Show the whole answer and the conversation">Expand</button>
  <button id="pin" aria-pressed="false" title="Keep open">Pin</button>
  <button id="dash" title="Open the dashboard">Dashboard</button>
  <button id="close" title="Stop and close (Esc)">✕</button>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LABELS = { listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…",
  done: "Done", idle: "Ready", "not running": "Voice isn't running" };
const IND = {
  listening: '<div class="mic"></div>',
  thinking: '<div class="spin"></div>',
  speaking: '<div class="bars"><i></i><i></i><i></i><i></i></div>',
};
let lastInd = "";

function show(id, text) {
  const el = $(id);
  el.textContent = text || "";
  el.classList.toggle("hidden", !text);
}
function box(id, text) {
  $(id).textContent = text || "";
  $(id + "box").classList.toggle("hidden", !text);
}

const ACTIVE = ["listening", "thinking", "speaking"];
let lastAlerts = "";

function renderAlerts(alerts) {
  const key = alerts.map((a) => a.id).join(",");
  if (key === lastAlerts) return;
  lastAlerts = key;
  const box = $("alerts");
  box.replaceChildren();
  for (const a of alerts) {  // built with textContent: reminder text is never parsed as HTML
    const card = document.createElement("div");
    card.className = "alert";
    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("b");
    title.textContent = a.title;
    const when = document.createElement("span");
    when.className = "when";
    const t = new Date(a.at);
    when.textContent = isNaN(t) ? "" : "  " + t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const text = document.createElement("div");
    text.className = "line";
    text.textContent = a.text;
    body.append(title, when, text);
    const btn = document.createElement("button");
    btn.textContent = "Dismiss";
    btn.onclick = () => window.pywebview.api.dismiss(a.id).then(tick);
    card.append(body, btn);
    box.append(card);
  }
}

let lastDetails = null;
const URL_RE = /(https?:\/\/[^\s<>"')\]]+)/g;

function renderDetails(text) {
  if (text === lastDetails) return;
  lastDetails = text;
  const box = $("details");
  box.replaceChildren();
  box.classList.toggle("hidden", !text);
  for (const raw of (text || "").split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const row = document.createElement("div");
    const item = /^([-*•]|\d+[.)]|\[\d+\])\s+/.test(line);
    row.className = "row" + (item ? " item" : "");
    const body = item ? line.replace(/^([-*•]|\d+[.)])\s+/, "") : line;
    let at = 0;
    for (const m of body.matchAll(URL_RE)) {  // links built as elements: text is never HTML
      row.append(document.createTextNode(body.slice(at, m.index)));
      const a = document.createElement("a");
      a.textContent = m[0].length > 60 ? m[0].slice(0, 57) + "…" : m[0];
      a.title = m[0];
      a.onclick = () => window.pywebview.api.open_link(m[0]);
      row.append(a);
      at = m.index + m[0].length;
    }
    row.append(document.createTextNode(body.slice(at)));
    box.append(row);
  }
}

// The conversation while this window is open: each finished exchange moves up into "earlier"
// when the next one starts. Kept in the page only; nothing is stored.
const EARLIER_MAX = 6;
const earlier = [];
let current = { id: "", heard: "", reply: "" };

function track(v) {
  if (v.turn_id && v.turn_id !== current.id) {
    if (current.id && (current.heard || current.reply)) {
      earlier.push({ heard: current.heard, reply: current.reply });
      if (earlier.length > EARLIER_MAX) earlier.shift();
      renderEarlier();
    }
    current = { id: v.turn_id, heard: "", reply: "" };
    return true;
  }
  if (v.heard) current.heard = v.heard;
  if (v.reply) current.reply = v.reply;
  return false;
}

function renderEarlier() {
  const box = $("earlier");
  box.replaceChildren();
  for (const ex of earlier) {  // built with textContent: nothing said is parsed as HTML
    const item = document.createElement("div");
    item.className = "ex";
    if (ex.heard) {
      const q = document.createElement("div");
      q.className = "q";
      q.textContent = "You: " + ex.heard;
      item.append(q);
    }
    if (ex.reply) {
      const a = document.createElement("div");
      a.className = "a";
      a.textContent = ex.reply;
      item.append(a);
    }
    box.append(item);
  }
}

function render(v) {
  const turnChanged = track(v);
  $("earlier").classList.toggle("hidden", !(v.expanded && earlier.length));
  $("expand").setAttribute("aria-pressed", v.expanded ? "true" : "false");
  $("expand").textContent = v.expanded ? "Shrink" : "Expand";
  if (turnChanged) requestAnimationFrame(() => { $("main").scrollTop = $("main").scrollHeight; });
  const alerts = v.alerts || [];
  const alertOnly = alerts.length > 0 && !ACTIVE.includes(v.state);
  renderAlerts(alerts);
  const ind = alertOnly ? '<div class="bell"></div>' : (IND[v.state] || '<div class="dot"></div>');
  if (ind !== lastInd) { $("ind").innerHTML = ind; lastInd = ind; }
  const followup = v.trigger === "followup";
  $("label").textContent = alertOnly ? alerts[alerts.length - 1].title
    : followup && v.state === "listening" && !v.question
    ? "Anything else?" : (LABELS[v.state] || v.state);
  $("trigger").textContent = v.trigger && !followup && !alertOnly ? "via " + v.trigger : "";
  if (alertOnly) v = Object.assign({}, v, { heard: "", reply: "", question: "", error: "" });
  const notices = [];
  if (v.killed) notices.push("Actions are off (kill switch).");
  if (v.paused) notices.push("Capture is paused.");
  show("notice", notices.join(" "));
  box("heard", v.heard);
  show("question", v.question);
  show("progress", v.state === "thinking" && !alertOnly ? v.progress : "");
  $("stop").classList.toggle("hidden", !ACTIVE.includes(v.state));
  box("reply", v.reply);
  show("error", v.error);
  renderDetails(alertOnly ? "" : v.details);
  $("pin").setAttribute("aria-pressed", v.pinned ? "true" : "false");
}

// Once you've closed it, the page calls nothing more: tearing the window down fires mouse and
// focus events, and a call into Python then could hold the teardown up.
let closing = false;
function closeNow() { closing = true; window.pywebview.api.stop(true); }

async function tick() {
  if (closing || !window.pywebview || !window.pywebview.api) return;
  try { render(await window.pywebview.api.view()); } catch (e) { /* the next poll retries */ }
}

window.addEventListener("pywebviewready", () => { tick(); setInterval(tick, 220); });
// Esc and ✕ stop whatever voice is doing as well as closing the window. With text in the
// box, Esc clears it first.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.activeElement === $("prompt") && $("prompt").value) { $("prompt").value = ""; holdNow(); return; }
  closeNow();
});

// Standing by: the window stays open while the mouse is over it or you're typing in it.
let hovering = false;
let held = null;
function holdNow() {
  const on = hovering || document.activeElement === $("prompt") || $("prompt").value.trim() !== "";
  if (closing || on === held || !window.pywebview) return;
  held = on;
  window.pywebview.api.hold(on);
}
document.body.addEventListener("mouseenter", () => { hovering = true; holdNow(); });
document.body.addEventListener("mouseleave", () => { hovering = false; holdNow(); });
$("prompt").addEventListener("focus", holdNow);
$("prompt").addEventListener("blur", holdNow);
$("prompt").addEventListener("input", holdNow);
$("askform").addEventListener("submit", async (e) => {
  e.preventDefault();  // nothing is submitted anywhere: the text goes to Donna through the API
  const text = $("prompt").value.trim();
  if (!text) return;
  const why = await window.pywebview.api.ask(text);
  if (why) { $("note").textContent = why; return; }
  $("prompt").value = "";
  $("note").textContent = "Sent to Donna.";
  holdNow();
  tick();
});
$("talk").onclick = async () => {
  const why = await window.pywebview.api.talk();
  $("note").textContent = why || "Listening…";
};
$("expand").onclick = async () => {
  const on = $("expand").getAttribute("aria-pressed") !== "true";
  await window.pywebview.api.expand(on);
  tick();
};
document.addEventListener("pointerdown", () => { !closing && window.pywebview && window.pywebview.api.focus(); });
$("close").onclick = closeNow;
$("stop").onclick = () => window.pywebview.api.stop(false).then(tick);
$("pin").onclick = async () => {
  const on = $("pin").getAttribute("aria-pressed") !== "true";
  const now = await window.pywebview.api.pin(on);
  $("pin").setAttribute("aria-pressed", now ? "true" : "false");
};
$("dash").onclick = async () => {
  const msg = await window.pywebview.api.open_dashboard();
  $("note").textContent = msg || "Opened the dashboard.";
};
</script>
</body>
</html>
