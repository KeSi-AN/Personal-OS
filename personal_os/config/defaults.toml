# Personal OS configuration.
# Written on first run. Edit freely; comments are preserved when settings are changed from the CLI.
# Safe defaults: only window, git and terminal capture are on, and only after `install-hooks`.

# Where the database, logs, spool and runtime files live. Empty = %LOCALAPPDATA%\PersonalOS.
data_dir = ""

# Folders whose files and git repos are observed. Nothing outside these is watched.
watched_roots = ["~/Documents"]

[observers.window]
enabled = true
poll_interval_s = 1.0
min_focus_s = 2.0          # shorter focus (Alt-Tab passing through) is merged into its neighbour
title_stable_s = 3.0       # a title change must hold this long before it splits an interval

[observers.idle]
enabled = true
threshold_s = 300          # no input for this long = idle

[observers.fs]
enabled = false            # turned on by the first-run wizard
debounce_s = 2.0
burst_events_per_s = 50

[observers.git]
enabled = true
safety_poll_active_s = 300
safety_poll_inactive_s = 3600

[observers.terminal]
enabled = true

[observers.browser]
enabled = false            # needs the extension + native host (phase 2)

[observers.editor]
enabled = false            # needs the VS Code extension

[observers.clipboard]
enabled = false            # opt-in only, text only, 24 h retention

[privacy]
# Allowlist mode: when true, only domains in allowed_domains are captured by the browser.
allowlist_mode = false
allowed_domains = []
min_dwell_s = 5

# Apps whose activity is never stored (matched case-insensitively on the executable name).
blocked_apps = [
    "KeePass.exe", "KeePassXC.exe", "1Password.exe", "Bitwarden.exe", "Dashlane.exe",
    "CredentialUIBroker.exe", "consent.exe",
    "WhatsApp.exe", "WhatsApp.Root.exe",
]

# Domains never captured (subdomains included).
blocked_domains = [
    "whatsapp.com", "whatsapp.net", "instagram.com",
    "messenger.com", "web.telegram.org", "discord.com", "signal.org",
    "paypal.com",
]
# Any domain label containing one of these words is blocked (catches most bank sites).
blocked_domain_keywords = ["bank", "netbanking"]

# Visits are kept as "domain + time" only, with no title or page text.
sensitive_domains = ["mail.google.com", "outlook.live.com", "outlook.office.com"]

# Visits are kept with title and time, but the page text is never stored (your own documents).
no_text_domains = [
    "docs.google.com", "drive.google.com", "sheets.google.com", "slides.google.com",
    "onedrive.live.com", "sharepoint.com", "notion.so", "notion.site",
]

# Window titles matching these regexes are stored as [redacted] (the app name is kept).
# Private/incognito markers catch the browser window title of a private tab; the exact suffix
# each browser uses is verified in phase 1. Mail titles carry email subjects.
redact_title_patterns = [
    "(?i)\\bwhatsapp\\b", "(?i)\\binstagram\\b",
    "(?i)\\b(?:incognito|inprivate|private browsing|private window)\\b",
    "(?i)\\bgmail\\b", "(?i)- outlook\\b",
]

# Titles containing these words make the event sensitive (free text removed, short retention).
sensitive_keywords = ["password", "passcode", "otp", "diagnosis", "prescription", "net banking"]

# Files matching these globs are never read; only "it changed" is recorded.
secret_path_globs = [
    ".env", ".env.*", "*.pem", "*.key", "*.pfx", "*.p12", "id_rsa*", "id_ed25519*", "id_ecdsa*",
    "credentials", "credentials.*", "*.kdbx", ".git-credentials", ".npmrc", ".pypirc", "secrets.*",
    ".netrc", "*.keystore",
]
secret_dir_names = [".ssh", ".aws", ".gnupg", ".azure", ".kube"]

[retention]
raw_days = 30
sensitive_days = 7         # events classified sensitive (free text already removed)
page_text_days = 90
terminal_output_days = 14
clipboard_hours = 24

[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
fast_model = "qwen3:4b"
reasoning_model = "qwen3:4b"
embedding_model = "qwen3-embedding:0.6b"
enabled = true
num_ctx = 8192
gpu_layers = 99            # every layer on the GPU (-1 = let Ollama decide; it offloads too few here)
embedding_dims = 512       # first N dims of the embedding, renormalised (the model supports this)
timeout_s = 180
keep_alive = "2m"          # free the VRAM this long after the last call
# Background summaries and embeddings run only when all of these hold:
only_on_ac_power = true
min_user_idle_s = 120
skip_when_fullscreen = true
summarize_min_active_s = 300   # sessions shorter than this aren't summarised

[api]
host = "127.0.0.1"
port = 47821

[api.lan]
enabled = false            # phone access (phase 6): HTTPS + per-device pairing
port = 47822

[actions]
browser = "brave"          # the browser Donna controls through the extension (brave, chrome, edge)
auto_allow_tiers = [0, 1]  # only for requests you make directly; see DESIGN.md section 6.3
# Folders actions may touch besides watched_roots and the notes/screenshots folders.
allowed_paths = []
act_in_watched_roots = true  # false: actions only in allowed_paths (watched folders are still captured)
# Tools that always ask, even when their tier would run without asking.
confirm_tools = []
rate_per_minute = 30
tier2_rate_per_minute = 10
command_timeout_s = 120
undo_keep_days = 7         # originals kept so edit_file can be undone
plugins_enabled = false    # load your own tools from plugins/ in the data folder (runs their code)

# Apps `open_app` can start (name -> program and fixed arguments). %VARS% are expanded.
# Only these can be started, so a plan can never run an arbitrary program. Add your own with
# personal-os config set actions.apps.NAME '["C:/path/to/app.exe"]'. Names are matched
# loosely ("File Explorer" = explorer, "calc" = calculator, "code" = vscode).
[actions.apps]
vscode = ['%LOCALAPPDATA%\Programs\Microsoft VS Code\Code.exe']
terminal = ["wt.exe"]
explorer = ["explorer.exe"]
notepad = ["notepad.exe"]
calculator = ["calc.exe"]
paint = ["mspaint.exe"]
snipping_tool = ["SnippingTool.exe"]
control_panel = ["control.exe"]
brave = ['%PROGRAMFILES%\BraveSoftware\Brave-Browser\Application\brave.exe']
chrome = ['%PROGRAMFILES%\Google\Chrome\Application\chrome.exe']
edge = ['%PROGRAMFILES(X86)%\Microsoft\Edge\Application\msedge.exe']

# Named commands `run_command` can run (no shell). Example:
# [actions.commands.tests]
# argv = ["uv", "run", "pytest", "-q"]
# cwd = "~/Documents/Personal-OS"
[actions.commands]

[voice]
enabled = false            # push-to-talk Ctrl+Alt+Shift+V; runs in its own process
stt_model = "small"        # Whisper small, multilingual, told it's English: as in JARVIS
stt_fast_model = ""        # a smaller Whisper heard first, if set; "" = stt_model only (JARVIS)
stt_hints = false          # prompt recognition with your app/folder names (JARVIS: no prompt)
wake_word_enabled = true   # Vosk listens for the wake word, as in JARVIS: "Donna", "hey Donna" ...
wake_words = ["donna"]     # each counts as a whole word ("Madonna" doesn't)
echo_cancel = true         # take the speakers out of the mic, so you can talk over a reply
mic_floor = 0.002          # quietest level counted as speech; `personal-os voice mic` shows yours
vad_silence_ms = 600       # quiet this long ends your turn (it waits longer after "open ...")
router_threshold = 0.85    # how sure a name match must be to act without asking
barge_in = "voice"         # voice: talking over a reply (or "Donna") stops it | hotkey: only Ctrl+Alt+Shift+V
tts = "piper"              # piper (local, streams; falls back to windows) | windows | speechify (cloud)
piper_voice = "en_US-lessac-medium"   # in voice/piper/; `personal-os voice setup` downloads it
piper_length_scale = 0.95  # under 1 speaks a little faster
windows_voice = "Microsoft Zira Desktop"   # `personal-os voice voices` lists them; Hazel is UK English
popup = true               # a small window shows each turn live: transcript, reply, state
popup_position = "bottom-right"   # bottom-right | top-right | bottom-left | top-left
popup_autoclose_s = 5.0    # closes this long after the reply is spoken, unless pinned
followup_s = 10.0          # after a reply, listen this long for a follow-up (no wake word), as in JARVIS; 0 = off
speechify_voice = "geffen_32"
speechify_model = "simba-3.5"
max_spoken_chars = 600

[briefings]
enabled = false            # a morning briefing and an end-of-day summary, once a day each
morning_after = "09:00"    # offered the first time you're active after this
evening_after = "18:30"
speak = true               # also read aloud when voice is on

[agent]
# Donna as one assistant over general tools: conversation, what's open now, your history,
# reminders, files, apps (docs/AGENT.md). false: the older separate ask / do paths.
enabled = true
max_steps = 4              # model calls per request (each about 1-3 s)
name = "Donna"
user_name = ""             # how she addresses you; empty: no name
