# The live bench's cases: requests you really made (voice history, 16-19 Nov) and the
# shapes they stand for. `from` says when and what went wrong then. Field meanings are in
# cases.py; patterns are regexes, any case. The pretend machine: Brave (GitHub, YouTube Music
# playing "bad luck", an Fmovies tab on Dune), VS Code and Claude open; your real app list.
#
# Times are what a good answer on the GTX 1650 can do: rules in a few seconds, one model
# step (prompt already read) in about 10, a lookup with an answer written in about 30.

