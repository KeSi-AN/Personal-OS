# Phase 3 acceptance: two labelled days across three projects plus personal time.
#
# Day 1 is the "learning" day: the resolver starts cold, then a simulated user corrects the
# inbox once. Day 2 (from `evaluate_from`) is the test: same habits, different pages, files
# and commands. Every step carries its true project in `project` (ground truth only; it is
# never put into events). Generic apps (Claude, Windows Terminal, File Explorer) and shared
# sites (Stack Overflow, Google, YouTube) are used for different projects on purpose.

