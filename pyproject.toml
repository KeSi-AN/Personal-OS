[project]
name = "personal-os"
version = "0.0.1"
description = "Local-first personal context and assistant layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
    "tomlkit>=0.13",
    "platformdirs>=4.2",
    "watchdog>=5",
    "psutil>=6",
    "pathspec>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pystray>=0.19",
    "pillow>=10",
    "cryptography>=43",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "keyring>=25",
    "mcp>=1.2",
    "numpy>=1.26",
    "rapidfuzz>=3.14.6",
    "piper-tts>=1.8.0",
    "pycaw>=20260927",
    "pywebview>=5",
    "livekit>=1.2.1",
    "pyaudiowpatch>=0.2.12.9",
    "vosk>=0.3.45",
    "scipy>=1.18.1",
]

[project.scripts]
personal-os = "personal_os.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil>=7.2.2.20260906",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personal_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: touches the real OS (windows, files, shells); not run by default",
    "llm: uses the local model through Ollama (minutes); not run by default",
]
addopts = "-m 'not live and not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["personal_os", "tests"]

[tool.ruff.lint.per-file-ignores]
# test corpora and fixtures read better as one item per line
"tests/*" = ["E501"]
# HTML templates read better unwrapped
"personal_os/web/pages.py" = ["E501"]
"personal_os/web/v2.py" = ["E501"]
"personal_os/web/brief.py" = ["E501"]
# the classifier's site, app and keyword tables read better one per line
"personal_os/context/activity.py" = ["E501"]
"personal_os/web/html.py" = ["E501"]
# user-facing CLI messages read better on one line
"personal_os/interfaces/cli_phase7.py" = ["E501"]
# the agent prompt's worked examples are one JSON object per line
"personal_os/actions/agent.py" = ["E501"]
# an embedded PowerShell script
"personal_os/interfaces/notify.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "pystray", "pystray.*", "faster_whisper", "faster_whisper.*", "sounddevice", "piper", "piper.*", "onnxruntime", "onnxruntime.*", "webview", "webview.*", "pycaw", "pycaw.*", "comtypes", "comtypes.*", "livekit", "livekit.*", "pyaudiowpatch", "pyaudiowpatch.*", "vosk", "vosk.*"]
ignore_missing_imports = true

[tool.uv]
# Windows is the only platform with observers today (and PyAudioWPatch's loopback is Windows-only).
environments = ["sys_platform == 'win32'"]
